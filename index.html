<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps</title>
<meta name="theme-color" content="#1e2b37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apps">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#1e2b37;--card:#2c3e50;--card2:#34495e;--ink:#ecf0f1;--mute:#95a5a6;--turq:#1abc9c;--blue:#3498db}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;line-height:1.1;margin:4px 0 16px;font-weight:700}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
a{display:block;background:var(--card);border-radius:6px;padding:14px;border-left:4px solid var(--turq);color:inherit;text-decoration:none}
a:hover{background:var(--card2)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
b{display:block;font-weight:600}
span{font-size:14px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <ul>
    <li><a href="smoking-log/"><b>Smoking log</b><span>Log cigarettes per day and track smoke-free streaks.</span></a></li>
    <li><a href="fridge-tracker/"><b>Fridge tracker</b><span>Keep track of what's in the fridge and when it expires.</span></a></li>
    <li><a href="coloring/"><b>Name coloring book</b><span>Type a name and color it in, with stickers.</span></a></li>
  </ul>
</main>
<script>
// Offline support: one service worker for the whole site (see sw.js).
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW registration failed", e)));
}
</script>
</body>
</html>
