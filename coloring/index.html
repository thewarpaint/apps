<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Name Coloring Book</title>
<meta name="theme-color" content="#f6f1fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coloring">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* Fredoka, self-hosted so it works offline (SIL OFL, see vendor/fredoka/OFL.txt) */
  @font-face {
    font-family: "Fredoka"; font-style: normal; font-weight: 600 700; font-display: swap;
    src: url(../vendor/fredoka/fredoka-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Fredoka"; font-style: normal; font-weight: 600 700; font-display: swap;
    src: url(../vendor/fredoka/fredoka-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  :root {
    --ink: #3b3355;
    --paper: #fffdf8;
    --panel: #ffffff;
    --line: #ece6f5;
    --accent: #8b7fd1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; touch-action: manipulation; } /* no double-tap zoom */
  body {
    font-family: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--ink);
    background: #f6f1fb;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  header {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px;
  }
  header h1 { font-size: 20px; margin: 0 6px 0 0; font-weight: 700; white-space: nowrap; }
  form { display: flex; gap: 8px; flex: 1; min-width: 220px; }
  input[type=text] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 18px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--panel); color: var(--ink);
    outline: none; -webkit-user-select: text; user-select: text;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; font-size: 16px; color: var(--ink);
    border: 2px solid var(--line); background: var(--panel);
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:active { transform: scale(0.96); }

  #stage {
    flex: 1; min-height: 0; position: relative;
    margin: 0 12px; display: flex; align-items: center; justify-content: center;
  }
  #board {
    position: relative; background: var(--paper);
    border-radius: 18px; box-shadow: 0 4px 18px rgba(80, 60, 130, 0.12);
    overflow: hidden; touch-action: none;
  }
  #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #outline, #bg { pointer-events: none; }
  button:disabled { opacity: .4; cursor: default; }
  /* Picture controls, shown over the bottom of the board while coloring a picture */
  #picTools {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 8px; align-items: center; max-width: calc(100% - 16px);
    background: rgba(255, 255, 255, .92); border: 2px solid var(--line); border-radius: 999px;
    padding: 4px 6px; box-shadow: 0 2px 10px rgba(80, 60, 130, 0.15);
  }
  #picTools[hidden] { display: none; }
  .seg { display: flex; gap: 2px; flex: none; }
  .seg button { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; }
  .seg button svg { width: 22px; height: 22px; }
  .seg button[aria-pressed="true"] { background: #efeafb; border-color: var(--accent); }
  #detailWrap { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0; }
  #detailWrap[hidden] { display: none; }
  #detail { width: 90px; min-width: 50px; accent-color: var(--accent); }
  /* Loading overlay while a picture is turned into a coloring page */
  #loader {
    position: absolute; inset: 0; z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(246, 241, 251, .7); font-weight: 600; text-align: center; padding: 16px;
    animation: loaderIn .2s ease-out;
  }
  #loader[hidden] { display: none; }
  #loader .ring {
    width: 56px; height: 56px; border-radius: 50%;
    background: conic-gradient(#ffadad, #ffe5a0, #caffbf, #9bf6ff, #bdb2ff, #ffc6ff, #ffadad);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
    animation: spin 1s linear infinite;
  }
  #loader span { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes loaderIn { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #loader { animation: none; }
    #loader .ring { animation-duration: 3s; }
  }
  button:disabled:active { transform: none; }
  /* "Draw it!" and the photo button share one height; the photo button is square */
  #nameForm > button { height: 42px; flex: none; }
  #photoBtn { width: 42px; }
  #paint { cursor: crosshair; }

  #tools {
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    position: relative; /* sticker panel anchors here, centered on screen */
  }
  .tool-row { display: flex; gap: 8px; align-items: center; justify-content: center; max-width: 100%; }
  .group {
    display: flex; gap: 6px; align-items: center;
    background: var(--panel); border-radius: 999px; padding: 6px 8px;
    border: 2px solid var(--line);
    max-width: 100%;
  }
  .group button, .group .sticker-wrap { flex: none; }
  #palette {
    flex-wrap: wrap; justify-content: center;
    gap: 8px; padding: 8px 10px; border-radius: 22px;
  }
  @media (max-width: 720px) {
    /* two even rows of six instead of a lopsided wrap */
    #palette { display: grid; grid-template-columns: repeat(6, 30px); }
  }
  @media (max-width: 480px) {
    /* shrink swatches and action buttons so palette + actions share one row */
    :root { --sw: clamp(22px, calc((100vw - 226px) / 6), 30px); }
    #palette { gap: 6px; padding: 8px; grid-template-columns: repeat(6, var(--sw)); }
    .swatch { width: var(--sw); height: var(--sw); }
    #actions .icon { width: 36px; height: 36px; }
  }
  @media (max-width: 350px) {
    /* smallest phones: tighten spacing so the row still fits at 320px */
    .tool-row { gap: 6px; }
    #palette { gap: 4px; padding: 6px; }
    #actions { gap: 4px; padding: 6px; }
    #actions .icon { width: 32px; height: 32px; }
  }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%; padding: 0;
    border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line);
  }
  .swatch.on { box-shadow: 0 0 0 3px var(--ink); }
  .size { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }
  .size span { display: block; border-radius: 50%; background: var(--ink); }
  .tool.on, .size.on { background: #efeafb; border-color: var(--accent); }
  .icon { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; }
  .icon svg { width: 22px; height: 22px; }
  .sub { display: flex; gap: 4px; }
  .sep { width: 2px; height: 26px; background: var(--line); border-radius: 2px; margin: 0 2px; }
  #stickerBtn .cur { display: inline-block; font-size: 22px; line-height: 1; }
  #stickerBtn .cur.pop { animation: stickerPop .35s ease-out; }
  @keyframes stickerPop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Stay-inside icon: color clipped to the circle when on, spilling out when off */
  #insideBtn { --brush: #ffadad; }
  #insideBtn .scrib { stroke: var(--brush); }
  #insideBtn .spill { display: none; }
  #insideBtn:not(.on) .spill { display: inline; }
  #insideBtn:not(.on) .clipped { display: none; }
  @media (prefers-reduced-motion: reduce) { #stickerBtn .cur.pop { animation: none; } }
  #stickerPanel {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 16px);
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    box-shadow: 0 8px 24px rgba(80, 60, 130, 0.18);
    padding: 10px; display: none; z-index: 10;
    grid-template-columns: repeat(6, minmax(0, 44px)); gap: 6px;
  }
  #stickerPanel.open { display: grid; }
  #stickerPanel button {
    width: 100%; height: auto; aspect-ratio: 1; padding: 0; font-size: 26px; line-height: 1;
    border-radius: 12px; border: 2px solid transparent; background: transparent;
  }
  #stickerPanel button.on { border-color: var(--accent); background: #efeafb; }
  #toast {
    position: fixed; left: 50%; top: 14px; transform: translate(-50%, -20px);
    background: var(--ink); color: #fff; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Phones on their side: the tools become columns either side of the board.
     Left: sizes/eraser/stickers/stay-inside. Right: palette over actions. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --sw: clamp(20px, calc((100vh - 212px) / 6), 30px); }
    body {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "left header right" "left stage right";
    }
    header { grid-area: header; padding: 8px 4px; flex-wrap: nowrap; }
    header h1 { font-size: 17px; }
    form { min-width: 0; }
    input[type=text] { padding: 6px 12px; font-size: 16px; }
    header button { padding: 6px 12px; }
    #nameForm > button { height: 36px; }
    #photoBtn { width: 36px; padding: 0; }
    #stage { grid-area: stage; margin: 0 4px 8px; }
    #tools { display: contents; }
    #toolGroup {
      grid-area: left; align-self: center; margin-left: 10px;
      flex-direction: column; border-radius: 26px; padding: 8px 6px;
      position: relative; /* sticker panel anchors here instead of #tools */
    }
    #toolGroup .sub { flex-direction: column; }
    #toolGroup .sep { width: 26px; height: 2px; margin: 2px 0; }
    .tool-row { grid-area: right; align-self: center; flex-direction: column; margin-right: 10px; }
    #palette { display: grid; grid-template-columns: repeat(2, var(--sw)); gap: 5px; padding: 8px; }
    .swatch { width: var(--sw); height: var(--sw); }
    #actions { flex-direction: column; border-radius: 26px; padding: 6px; }
    #actions .icon { width: 36px; height: 36px; }
    #stickerPanel {
      bottom: auto; top: 50%; left: calc(100% + 10px); transform: translateY(-50%);
      max-width: calc(100vw - 100px);
    }
  }
</style>
</head>
<body>
<header>
  <h1>🖍️ Color My Name</h1>
  <form id="nameForm" autocomplete="off">
    <input id="nameInput" type="text" maxlength="20" placeholder="Type your name" value="Sofia" aria-label="Your name">
    <button class="primary" type="submit">Draw it!</button>
    <button class="icon primary" type="button" id="photoBtn" aria-label="Color a picture" title="Color a picture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8" fill="#ffe5a0"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18"/></svg>
    </button>
    <input type="file" id="photoInput" accept="image/*" hidden>
  </form>
</header>

<div id="stage">
  <div id="board">
    <canvas id="bg"></canvas>
    <canvas id="paint"></canvas>
    <canvas id="outline"></canvas>
  </div>
  <div id="picTools" hidden>
    <div class="seg" role="group" aria-label="Show">
      <button type="button" id="viewLines" aria-pressed="true" aria-label="Coloring page" title="Coloring page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="16" cy="9.5" r="1.8"/><path d="M4 17l5-5.5 4 4 2.5-2.5L20 17"/></svg>
      </button>
      <button type="button" id="viewPhoto" aria-pressed="false" aria-label="Photo" title="Photo">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3" fill="#a0c4ff"/><circle cx="16" cy="9.5" r="1.8" fill="#ffe5a0"/><path d="M4 17l5-5.5 4 4 2.5-2.5L20 17v2H4z" fill="#a8e6cf"/></svg>
      </button>
    </div>
    <label id="detailWrap" hidden>Detail <input type="range" id="detail" min="0" max="1" step="0.05" value="0.35"></label>
  </div>
  <div id="loader" role="status" aria-live="polite" hidden>
    <div class="ring" aria-hidden="true"></div>
    <span>Making your coloring page…</span>
  </div>
</div>

<div id="tools">
  <div class="group" id="toolGroup">
    <div id="sizes" class="sub" aria-label="Brush size"></div>
    <span class="sep"></span>
    <button class="tool icon" id="eraserBtn" aria-label="Eraser" title="Eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 17l8-8 7 7-4 4H7z" fill="#ffd1dc"/><path d="M11 9l4-4 6 6-3 5"/><path d="M7 20h13"/></svg>
    </button>
    <div class="sticker-wrap">
      <button class="tool icon" id="stickerBtn" aria-label="Stickers" title="Stickers" aria-expanded="false">
        <span class="cur">⭐</span>
      </button>
      <div id="stickerPanel" role="listbox" aria-label="Pick a sticker"></div>
    </div>
    <button class="tool icon on" id="insideBtn" aria-label="Stay inside the letters" title="Stay inside the letters" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round">
        <defs><clipPath id="insideClip"><circle cx="12" cy="12" r="8"/></clipPath></defs>
        <path class="scrib clipped" clip-path="url(#insideClip)" stroke-width="3" d="M2 10L10 2M2 16L16 2M3 21L21 3M8 22L22 8M14 22L22 14"/>
        <path class="scrib spill" stroke-width="3" d="M2 10L10 2M2 16L16 2M3 21L21 3M8 22L22 8M14 22L22 14"/>
        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </div>
  <div class="tool-row">
  <div class="group" id="palette" role="radiogroup" aria-label="Colors"></div>
  <div class="group" id="actions">
    <button class="icon" id="undoBtn" aria-label="Undo" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
    </button>
    <button class="icon" id="clearBtn" aria-label="Clear page" title="Clear page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
    <button class="icon primary" id="saveBtn" aria-label="Save picture" title="Save picture" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
  </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="text/plain" id="convWorkerSrc">
"use strict";
// Picture -> coloring page. Runs in a Web Worker so the page stays responsive.
// Input: RGBA pixels (at most ~1000px). Output: a line mask (255 = line).
let cur = null; // edge data for the last photo, reused when only the detail changes

self.onmessage = e => {
  const m = e.data;
  if (cur && cur.id === m.id) return post(m.id, "photo", cur.w, cur.h, edgeLines(cur, photoKeep(m.detail)));
  analyze(m);
};
function post(id, kind, w, h, lines) { self.postMessage({ id, kind, w, h, lines }, [lines.buffer]); }

function analyze({ id, w, h, data, detail }) {
  const n = w * h, S = Math.max(w, h), px = new Uint8ClampedArray(data);
  const L = new Float32Array(n);
  let colorful = 0;
  for (let i = 0, p = 0; p < n; i += 4, p++) {
    const r = px[i], g = px[i + 1], b = px[i + 2];
    L[p] = 0.299 * r + 0.587 * g + 0.114 * b;
    if (Math.max(r, g, b) - Math.min(r, g, b) > 48) colorful++;
  }
  // Estimate the paper brightness everywhere (blur of a max filter) and divide
  // by it, so shadows on a photographed page still read as paper.
  const paperLum = boxBlur(maxFilter(L, w, h, Math.max(3, Math.round(S / 150))), w, h, Math.max(8, Math.round(S / 50)));
  const v = new Float32Array(n);
  let paper = 0, ink = 0, mid = 0;
  for (let p = 0; p < n; p++) {
    const x = L[p] / Math.max(40, paperLum[p]);
    v[p] = x;
    if (x > 0.85) paper++; else if (x < 0.55) ink++; else mid++;
  }
  // Black-and-white drawing: little colour, few in-between greys, mostly paper.
  if (colorful / n < 0.04 && mid / n < 0.12 && paper / n > 0.55 && ink / n > 0.003) {
    let lines = new Uint8Array(n), inkPx = 0;
    for (let p = 0; p < n; p++) if (v[p] < 0.7) { lines[p] = 255; inkPx++; }
    if (inkPx / n > 0.2) {
      // Mostly ink, e.g. a silhouette: keep only its outline.
      const edge = new Uint8Array(n);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (lines[p] && (x === 0 || y === 0 || x === w - 1 || y === h - 1 ||
            !lines[p - 1] || !lines[p + 1] || !lines[p - w] || !lines[p + w])) edge[p] = 255;
      }
      lines = dilate(edge, w, h, lineRadius(S));
    }
    removeSmall(lines, w, h, Math.round(n * 0.00003));
    cur = null;
    return post(id, "lineart", w, h, lines);
  }
  // Anything else: Canny-style edges. Smooth, take the gradient, then thin it
  // to 1px ridges (non-maximum suppression).
  const B = boxBlur(boxBlur(L, w, h, 2), w, h, 2);
  const mag = new Float32Array(n), dir = new Uint8Array(n), nms = new Float32Array(n);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const p = y * w + x;
    const gx = -B[p - w - 1] - 2 * B[p - 1] - B[p + w - 1] + B[p - w + 1] + 2 * B[p + 1] + B[p + w + 1];
    const gy = -B[p - w - 1] - 2 * B[p - w] - B[p - w + 1] + B[p + w - 1] + 2 * B[p + w] + B[p + w + 1];
    mag[p] = Math.hypot(gx, gy);
    let a = Math.atan2(gy, gx) * 180 / Math.PI; if (a < 0) a += 180;
    dir[p] = a < 22.5 || a >= 157.5 ? 0 : a < 67.5 ? 1 : a < 112.5 ? 2 : 3;
  }
  const off = [[-1, 1], [-w - 1, w + 1], [-w, w], [-w + 1, w - 1]];
  const sample = [];
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const p = y * w + x, m = mag[p], o = off[dir[p]];
    if (m > 4 && m >= mag[p + o[0]] && m >= mag[p + o[1]]) { nms[p] = m; if ((p & 7) === 0) sample.push(m); }
  }
  sample.sort((a, b) => a - b);
  const edges = { id, w, h, S, nms, sample };
  if (mid / n < 0.12) {
    // Flat-colour artwork (cartoons, coloured-in drawings): few in-between
    // tones, so nearly every edge is real. Keep its drawn dark lines as they
    // are (a solid dark area becomes just its outline), and add colour
    // boundaries only where no drawn line already separates the shapes.
    cur = null;
    const r = lineRadius(S);
    const dark = new Uint8Array(n);
    for (let p = 0; p < n; p++) if (v[p] < 0.5) dark[p] = 255;
    const thick = erode(dark, w, h, 2 * r), nearInk = dilate(dark, w, h, 2 * r + 3);
    const lines = edgeLines(edges, 0.6);
    for (let p = 0; p < n; p++) {
      if (nearInk[p]) lines[p] = 0;
      if (dark[p] && !thick[p]) lines[p] = 255;
    }
    removeSmall(lines, w, h, Math.max(10, Math.round(S * 0.015)));
    return post(id, "flat", w, h, lines);
  }
  cur = edges;
  post(id, "photo", w, h, edgeLines(cur, photoKeep(detail)));
}

// The detail slider (0..1) keeps the strongest 5%..35% of a photo's ridges.
function photoKeep(detail) { return 0.05 + 0.30 * Math.min(1, Math.max(0, +detail || 0)); }

// Keep the strongest `keep` fraction of ridges as edges, extend them along
// weaker ridges (hysteresis), drop short scraps and thicken.

      applySnapshot(r, W, H, pictureLay(r.lay, W, H));
      syncMode();
      return;
    }
    state.src = null;
    pctx.clearRect(0, 0, state.W, state.H);
    pctx.drawImage(c, 0, 0);
  }

  paint.addEventListener("pointerdown", e => {
    e.preventDefault();
    paint.setPointerCapture(e.pointerId);
    pushUndo();
    state.drawing = true;
    state.last = toCanvas(e);
    if (state.regions && state.tool === "brush") regionMask(state.last);
    // In Photo view the brush is see-through so the photo shows under the color.
    // The whole stroke is drawn at full strength on its own layer and blended
    // on at 66% as one piece, so overlapping segments don't build up.
    state.seeThrough = state.tool === "brush" && !!state.lay.img && state.lay.view !== "lines";
    if (state.seeThrough) tctx.clearRect(0, 0, state.W, state.H);
    if (state.tool === "stamp") stamp(state.last);
    else { segment(state.last, state.last); blendStroke(); }
  });
  paint.addEventListener("pointermove", e => {
    if (!state.drawing) return;
    if (state.tool === "stamp") { moveStamp(toCanvas(e)); return; }
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = toCanvas(ev);
      segment(state.last, p);
      state.last = p;
    }
    blendStroke();
  });
  const end = () => { state.drawing = false; state.last = null; state.seeThrough = false; };
  paint.addEventListener("pointerup", end);
  paint.addEventListener("pointercancel", end);

  document.getElementById("nameForm").addEventListener("submit", e => {
    e.preventDefault();
    document.getElementById("nameInput").blur();
    generate(document.getElementById("nameInput").value);
  });
  // ---------- Picture -> coloring page ----------
  const picTools = document.getElementById("picTools");
  const viewLines = document.getElementById("viewLines");
  const viewPhoto = document.getElementById("viewPhoto");
  const detailWrap = document.getElementById("detailWrap");
  const detailInput = document.getElementById("detail");
  const loader = document.getElementById("loader");
  let loaderTimer;
  // Show the loading overlay, right away or only if the work takes longer than `delay` ms.
  function showLoader(delay = 0) {
    clearTimeout(loaderTimer);
    if (delay) loaderTimer = setTimeout(() => { loader.hidden = false; }, delay);
    else loader.hidden = false;
  }
  function hideLoader() {
    clearTimeout(loaderTimer);
    loader.hidden = true;
  }
  const LINE_RGB = [0x3b, 0x33, 0x55]; // same ink as the name outlines
  let picSeq = 0, worker = null;

  function getWorker() {
    if (worker) return worker;
    const src = document.getElementById("convWorkerSrc").textContent;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    worker.onmessage = e => {
      const m = e.data, lay = state.lay;
      if (!lay || !lay.img || lay.id !== m.id) return; // a newer picture (or a name) took over
      const art = document.createElement("canvas");
      art.width = m.w; art.height = m.h;
      const ax = art.getContext("2d"), id = ax.createImageData(m.w, m.h), d = id.data;
      for (let p = 0, i = 0; p < m.lines.length; p++, i += 4) {
        d[i] = LINE_RGB[0]; d[i + 1] = LINE_RGB[1]; d[i + 2] = LINE_RGB[2]; d[i + 3] = m.lines[p];
      }
      ax.putImageData(id, 0, 0);
      state.src = null;
      drawLayers({ ...lay, art, kind: m.kind, view: lay.art ? lay.view : "lines" });
      syncMode();
      hideLoader();
    };
    worker.onerror = () => {
      hideLoader();
      if (state.lay && state.lay.img) { state.lay.failed = true; syncMode(); }
      say("Couldn't make lines from that picture.");
    };
    return worker;
  }
  // Send the picture (at most 1000px) to the worker to find its lines.
  function makeLines(lay) {
    const k = Math.min(1, 1000 / Math.max(lay.img.width, lay.img.height));
    const w = Math.max(1, Math.round(lay.img.width * k)), h = Math.max(1, Math.round(lay.img.height * k));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.drawImage(lay.img, 0, 0, w, h);
    const data = x.getImageData(0, 0, w, h).data.buffer;
    try {
      getWorker().postMessage({ id: lay.id, w, h, data, detail: +detailInput.value }, [data]);
    } catch (err) {
      hideLoader();
      lay.failed = true; syncMode();
    }
  }
  viewLines.onclick = () => { if (state.lay.art) { state.src = null; drawLayers({ ...state.lay, view: "lines" }); syncMode(); } };
  viewPhoto.onclick = () => { state.src = null; drawLayers({ ...state.lay, view: "photo" }); syncMode(); };
  let detailTimer;
  detailInput.addEventListener("input", () => {
    clearTimeout(detailTimer);
    detailTimer = setTimeout(() => {
      if (!state.lay.img) return;
      showLoader(150); // re-thresholding is usually quick: only show the overlay if it isn't
      makeLines(state.lay);
    }, 200);
  });

  // Closed shapes between the picture's lines, so "stay inside" can keep the
  // brush in the shape where a stroke starts. Lines are thickened by 2px first
  // so small gaps don't join neighbouring shapes.
  function findRegions() {
    const W = state.W, H = state.H, n = W * H, d = octx.getImageData(0, 0, W, H).data;
    let wall = new Uint8Array(n);
    for (let p = 0; p < n; p++) if (d[p * 4 + 3] > 60) wall[p] = 1;
    wall = dilateBin(wall, W, H, 2);
    const labels = new Int32Array(n).fill(-1), stack = new Int32Array(n), boxes = [];
    let next = 0;
    for (let s = 0; s < n; s++) {
      if (wall[s] || labels[s] >= 0) continue;
      let sp = 0, x0 = W, y0 = H, x1 = 0, y1 = 0;
      stack[sp++] = s; labels[s] = next;
      while (sp) {
        const q = stack[--sp], x = q % W, y = (q - x) / W;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && !wall[q - 1] && labels[q - 1] < 0) { labels[q - 1] = next; stack[sp++] = q - 1; }
        if (x < W - 1 && !wall[q + 1] && labels[q + 1] < 0) { labels[q + 1] = next; stack[sp++] = q + 1; }
        if (q >= W && !wall[q - W] && labels[q - W] < 0) { labels[q - W] = next; stack[sp++] = q - W; }
        if (q < n - W && !wall[q + W] && labels[q + W] < 0) { labels[q + W] = next; stack[sp++] = q + W; }
      }
      boxes.push([x0, y0, x1, y1]);
      next++;
    }
    return { labels, boxes };
  }
  // Point `mask` at the shape under p (grown a little so paint reaches under the line).
  function regionMask(p) {
    const W = state.W, H = state.H, labels = state.regions.labels;
    let lab = -1;
    for (let r = 0; r <= 10 && lab < 0; r++) {
      for (let dy = -r; dy <= r && lab < 0; dy++) for (let dx = -r; dx <= r; dx++) {
        const x = Math.round(p.x) + dx, y = Math.round(p.y) + dy;
        if (x >= 0 && y >= 0 && x < W && y < H && labels[y * W + x] >= 0) { lab = labels[y * W + x]; break; }
      }
    }
    if (lab === state.maskRegion) return;
    state.maskRegion = lab;
    if (lab < 0) { mctx.fillRect(0, 0, W, H); return; } // on a thick line: paint freely
    // Only work inside the shape's bounding box (plus the growth margin).
    const G = 4, b = state.regions.boxes[lab];
    const bx = Math.max(0, b[0] - G), by = Math.max(0, b[1] - G);
    const bw = Math.min(W - 1, b[2] + G) - bx + 1, bh = Math.min(H - 1, b[3] + G) - by + 1;
    let m = new Uint8Array(bw * bh);
    for (let y = 0; y < bh; y++) {
      const row = (by + y) * W + bx;
      for (let x = 0; x < bw; x++) if (labels[row + x] === lab) m[y * bw + x] = 1;
    }
    m = dilateBin(m, bw, bh, G);
    const id = mctx.createImageData(bw, bh), d = id.data;
    for (let i = 0; i < m.length; i++) if (m[i]) d[i * 4 + 3] = 255;
    mctx.clearRect(0, 0, W, H);
    mctx.putImageData(id, bx, by);
  }
  function dilateBin(a, w, h, r) {
    const t = new Uint8Array(a.length), o = new Uint8Array(a.length);
    for (let y = 0; y < h; y++) {
      const row = y * w; let c = 0;
      for (let x = 0; x <= Math.min(r, w - 1); x++) if (a[row + x]) c++;
      for (let x = 0; x < w; x++) {
        if (c) t[row + x] = 1;
        if (x + r + 1 < w && a[row + x + r + 1]) c++;
        if (x - r >= 0 && a[row + x - r]) c--;
      }
    }
    for (let x = 0; x < w; x++) {
      let c = 0;
      for (let y = 0; y <= Math.min(r, h - 1); y++) if (t[y * w + x]) c++;
      for (let y = 0; y < h; y++) {
        if (c) o[y * w + x] = 1;
        if (y + r + 1 < h && t[(y + r + 1) * w + x]) c++;
        if (y - r >= 0 && t[(y - r) * w + x]) c--;
      }
    }
    return o;
  }

  const photoInput = document.getElementById("photoInput");
  document.getElementById("photoBtn").onclick = () => photoInput.click();
  photoInput.addEventListener("change", async () => {
    const f = photoInput.files[0];
    photoInput.value = "";
    if (!f) return;
    showLoader();
    const url = URL.createObjectURL(f);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      // Keep a copy at most 2200px on its longest side: big phone photos are
      // far larger than the board and would waste memory.
      const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * k));
      c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      usePicture(c);
    } catch (err) {
      hideLoader();
      say("Couldn't open that picture.");
    } finally {
      URL.revokeObjectURL(url);
    }
  });
  let relayoutTimer;
  window.addEventListener("resize", () => {
    fitBoard();
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(relayout, 200);
  });

  // ---------- Save picture ----------
  const saveBtn = document.getElementById("saveBtn");
  const toast = document.getElementById("toast");
  let toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }
  function flatten() {
    // paper + picture + paint + outline, exactly as shown on screen
    const c = document.createElement("canvas");
    c.width = state.W; c.height = state.H;
    const x = c.getContext("2d");
    x.fillStyle = "#fffdf8";
    x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bg, 0, 0);
    x.drawImage(paint, 0, 0);
    x.drawImage(outline, 0, 0);
    return new Promise(res => c.toBlob(res, "image/png"));
  }
  function fileName() {
    if (state.lay && state.lay.img) return "my-picture-coloring.png";
    const n = document.getElementById("nameInput").value.trim()
      .replace(/[^\p{L}\p{N} _-]/gu, "").replace(/\s+/g, "-").slice(0, 20);
    return (n || "my-name") + "-coloring.png";
  }
  // Outside claude.ai, fall back to a regular browser download.
  const browserDownloads = {
    async save({ filename, data }) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(data);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  };
  let downloads = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => {
      downloads = d;
      if (d) saveBtn.hidden = false;
    }).catch(() => {});
  } else {
    downloads = browserDownloads;
    saveBtn.hidden = false;
  }
  saveBtn.addEventListener("click", async () => {
    if (!downloads) return;
    saveBtn.disabled = true;
    try {
      const blob = await flatten();
      await downloads.save({ filename: fileName(), data: blob });
      say("Picture saved! 🎉");
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") {}
      else if (code === "rate_limited") say("One moment, then try again.");
      else if (code === "host_unavailable") { say("Open this page in a browser to save pictures."); saveBtn.hidden = true; }
      else { say("Saving isn't available here."); if (code !== "bad_request") saveBtn.hidden = true; }
    } finally {
      saveBtn.disabled = false;
    }
  });

  // ---------- No zooming ----------
  // iOS Safari ignores user-scalable=no, so block pinch and double-tap here too.
  const noZoom = e => e.preventDefault();
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, noZoom));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", noZoom);
  // Trackpad pinch on desktop arrives as ctrl+wheel.
  document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  syncUI();
  generate(document.getElementById("nameInput").value);
})();
</script>
<script>
// Offline support: one service worker for the whole site (see sw.js).
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(e => console.warn("SW registration failed", e)));
}
</script>
</body>
</html>
